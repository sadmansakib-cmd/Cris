services:
  api:
    profiles: []
    restart: unless-stopped
  web:
    profiles: []
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt

volumes:
  letsencrypt: {}
