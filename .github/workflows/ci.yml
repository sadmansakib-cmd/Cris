name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hault, POSTGRES_PASSWORD: hault, POSTGRES_DB: hault }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hault"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://hault:hault@localhost:5432/hault
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-prod-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      ENCRYPTION_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3RrZXk=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hault/api prisma:generate
      - run: pnpm --filter @hault/api prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
